<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Reflet</title>
  <meta name="description" content="Reflet — a puzzle of twin lights. One command drives two fireflies; her left is your right.">
  <style>
/* Reflet — feuille de style. Palette nuit : indigo profond, ambre, turquoise. */
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }

:root {
  --bg0: #0b0e2a;
  --bg1: #141b48;
  --ink: #e9edff;
  --muted: #9aa3d1;
  --amber: #ffce6b;
  --amber-glow: rgba(255, 194, 100, 0.55);
  --teal: #6fe3ff;
  --teal-glow: rgba(100, 215, 255, 0.5);
  --wall: #2b3163;
  --wall-top: #3d4489;
  --panel: rgba(20, 26, 66, 0.72);
}

body {
  font-family: -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  background: linear-gradient(180deg, var(--bg0) 0%, var(--bg1) 100%) fixed;
  color: var(--ink);
  min-height: 100vh;
  overflow-x: hidden;
  -webkit-tap-highlight-color: transparent;
}

#app {
  max-width: 720px;
  margin: 0 auto;
  padding: 14px 14px 8px;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}

/* ---------------------------------------------------------------- en-tête */
#top { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; }
.brand h1 {
  font-family: Georgia, "Times New Roman", serif;
  font-weight: 500;
  font-size: clamp(30px, 6vw, 42px);
  letter-spacing: 0.22em;
  color: var(--ink);
  text-shadow: 0 0 24px rgba(120, 160, 255, 0.35);
}
#tagline { color: var(--muted); font-size: 13px; letter-spacing: 0.08em; }
.topctl { display: flex; flex-direction: column; align-items: flex-end; gap: 8px; }
.langs { display: flex; gap: 4px; }

/* ---------------------------------------------------------------- boutons */
button {
  font: inherit;
  color: var(--ink);
  background: var(--panel);
  border: 1px solid rgba(150, 165, 255, 0.25);
  border-radius: 10px;
  padding: 8px 14px;
  cursor: pointer;
  transition: transform 0.08s ease, border-color 0.15s ease, background 0.15s ease;
}
button:hover { border-color: rgba(180, 195, 255, 0.55); }
button:active { transform: scale(0.96); }
button:focus-visible { outline: 2px solid var(--teal); outline-offset: 2px; }
button.primary {
  background: linear-gradient(135deg, #ffce6b, #ff9d5c);
  color: #241c07;
  font-weight: 700;
  border: none;
  box-shadow: 0 4px 22px rgba(255, 170, 90, 0.35);
}
button.big { font-size: 17px; padding: 12px 26px; }
button.ghost { background: transparent; }
button.round { width: 38px; height: 38px; padding: 0; border-radius: 50%; font-weight: 700; }
.pill { padding: 4px 10px; font-size: 12px; border-radius: 999px; }
.pill.active { border-color: var(--amber); color: var(--amber); }

/* ---------------------------------------------------------------- écrans */
main { flex: 1; display: flex; flex-direction: column; }
.screen { animation: fadein 0.25s ease; }
.hidden { display: none !important; }
@keyframes fadein { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; } }

.subtitle { margin: 22px 4px 18px; max-width: 52ch; line-height: 1.55; color: var(--ink); opacity: 0.92; }
.homebtns { display: flex; gap: 10px; flex-wrap: wrap; margin: 0 4px 20px; }
.keys { color: var(--muted); font-size: 12.5px; margin: 14px 4px; text-align: center; }

.levelgrid { display: flex; flex-wrap: wrap; gap: 8px; margin: 4px; }
.chip {
  width: 52px; height: 56px;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  font-size: 17px;
}
.chip.locked { opacity: 0.45; cursor: default; }
.chip-stars { font-size: 9px; color: var(--amber); letter-spacing: 1px; margin-top: 2px; min-height: 11px; }

/* ---------------------------------------------------------------- hud */
.hud { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin: 10px 0 2px; }
.hud-mid { display: flex; flex-direction: column; align-items: center; gap: 2px; min-width: 0; }
#hud-level { font-size: 15px; }
#hud-moves { font-size: 12.5px; }
.muted { color: var(--muted); }
.hud-right { display: flex; gap: 6px; align-items: center; }
#btn-undo, #btn-restart { font-size: 13px; padding: 8px 10px; }
.goalhint { text-align: center; color: var(--muted); font-size: 12.5px; margin: 6px 0 12px; letter-spacing: 0.04em; }

/* ---------------------------------------------------------------- plateau */
#board-wrap { display: flex; justify-content: center; }
#board {
  position: relative;
  border-radius: 14px;
  background: rgba(10, 13, 40, 0.6);
  box-shadow: inset 0 0 0 1px rgba(140, 160, 255, 0.14), 0 10px 40px rgba(0, 0, 20, 0.45);
  touch-action: none;
  outline: none;
}
#board.shake { animation: shake 0.28s ease; }
@keyframes shake {
  0%, 100% { transform: translateX(0); }
  25% { transform: translateX(-5px); }
  50% { transform: translateX(4px); }
  75% { transform: translateX(-2px); }
}

.cell { position: absolute; }
.cell.alt { background: rgba(255, 255, 255, 0.028); }
.cell.wall {
  background: linear-gradient(180deg, var(--wall-top), var(--wall));
  box-shadow: inset 0 -3px 0 rgba(0, 0, 30, 0.35), inset 0 1px 0 rgba(190, 200, 255, 0.18);
  border-radius: 5px;
  transform: scale(0.94);
}
.cell.goal-a, .cell.goal-b { border-radius: 50%; }
.cell.goal-a {
  box-shadow: inset 0 0 0 2px var(--amber), inset 0 0 14px rgba(255, 200, 100, 0.35);
  animation: breathe 2.6s ease-in-out infinite;
}
.cell.goal-b {
  box-shadow: inset 0 0 0 2px var(--teal), inset 0 0 14px rgba(100, 220, 255, 0.3);
  animation: breathe 2.6s ease-in-out infinite 1.3s;
}
@keyframes breathe {
  0%, 100% { box-shadow: inset 0 0 0 2px currentColor; }
  50% { filter: brightness(1.35); }
}
.cell.goal-a { color: var(--amber); }
.cell.goal-b { color: var(--teal); }

/* lucioles */
.fly {
  position: absolute;
  top: 0; left: 0;
  display: flex; align-items: center; justify-content: center;
  transition: transform 0.14s ease;
  pointer-events: none;
  z-index: 2;
}
.fly::after {
  content: "";
  width: 42%; height: 42%;
  border-radius: 50%;
  animation: flicker 1.9s ease-in-out infinite;
}
.fly.a::after { background: radial-gradient(circle at 35% 35%, #fff6dc, var(--amber) 60%); box-shadow: 0 0 14px 6px var(--amber-glow); }
.fly.b::after { background: radial-gradient(circle at 35% 35%, #eafcff, var(--teal) 60%); box-shadow: 0 0 14px 6px var(--teal-glow); animation-delay: 0.9s; }
@keyframes flicker {
  0%, 100% { opacity: 1; transform: scale(1); }
  45% { opacity: 0.75; transform: scale(0.88); }
  60% { opacity: 1; transform: scale(1.05); }
}
.fly.home::after { animation: homepulse 0.7s ease infinite alternate; }
@keyframes homepulse { from { transform: scale(1); } to { transform: scale(1.5); } }

/* ---------------------------------------------------------------- croix tactile */
.dpad {
  display: none;
  grid-template-columns: repeat(3, 56px);
  grid-template-rows: repeat(2, 48px);
  gap: 6px;
  justify-content: center;
  margin-top: 16px;
}
body.touch .dpad { display: grid; }
body.touch .touch-only { display: block; }
.touch-only { display: none; }
#dpad button { font-size: 18px; }

/* ---------------------------------------------------------------- superpositions */
#overlay {
  position: fixed; inset: 0;
  background: rgba(6, 8, 26, 0.78);
  backdrop-filter: blur(3px);
  display: flex; align-items: center; justify-content: center;
  z-index: 10;
  padding: 20px;
  animation: fadein 0.2s ease;
}
#overlay-card {
  background: linear-gradient(180deg, #161d4e, #10143a);
  border: 1px solid rgba(150, 165, 255, 0.3);
  border-radius: 16px;
  padding: 26px 24px;
  max-width: 430px;
  width: 100%;
  box-shadow: 0 18px 60px rgba(0, 0, 25, 0.6);
  text-align: center;
}
#overlay-card h2 {
  font-family: Georgia, serif;
  font-weight: 500;
  letter-spacing: 0.06em;
  margin-bottom: 12px;
  font-size: 24px;
}
.rules { text-align: left; }
.rules p { margin: 10px 0; line-height: 1.55; font-size: 14.5px; }
.rules-demo {
  display: flex; align-items: center; justify-content: center; gap: 10px;
  margin: 14px 0; color: var(--muted); font-size: 13px;
}
.demo-fly { font-size: 20px; }
.demo-fly.a { color: var(--amber); text-shadow: 0 0 10px var(--amber-glow); }
.demo-fly.b { color: var(--teal); text-shadow: 0 0 10px var(--teal-glow); }
#overlay-card button { margin-top: 14px; }
.btn-row { display: flex; gap: 8px; justify-content: center; }
.big { font-size: 20px; }
.star-row { font-size: 38px; margin: 6px 0 10px; letter-spacing: 6px; }
.star { color: rgba(160, 170, 220, 0.35); }
.star.on { color: var(--amber); text-shadow: 0 0 18px var(--amber-glow); animation: pop 0.4s ease; }
@keyframes pop { from { transform: scale(0.3); opacity: 0; } to { transform: scale(1); } }

/* ---------------------------------------------------------------- pied */
footer {
  margin-top: 18px;
  padding: 10px 4px 6px;
  color: var(--muted);
  font-size: 12px;
  text-align: center;
}
.series { font-style: italic; }

/* marge de sécurité pour les téléphones à encoche */
@supports (padding: env(safe-area-inset-bottom)) {
  footer { padding-bottom: calc(6px + env(safe-area-inset-bottom)); }
}

</style>
</head>
<body>

  </div>

  <div id="overlay" class="hidden" role="dialog" aria-modal="true">
    <div id="overlay-card"></div>
  </div>

  <script>
/*
 * Reflet — moteur de jeu pur (sans DOM).
 * Chargé par index.html (window.RefletEngine) et par les tests Node.
 * Règle centrale : un seul ordre de déplacement déplace les deux lucioles ;
 * la seconde (le reflet) joue le même ordre en miroir horizontal (G<->D).
 */
(function (root, factory) {
  if (typeof module === 'object' && module.exports) module.exports = factory();
  else root.RefletEngine = factory();
})(typeof self !== 'undefined' ? self : this, function () {
  'use strict';

  var DIRS = { U: [-1, 0], D: [1, 0], L: [0, -1], R: [0, 1] };
  var MIRROR = { U: 'U', D: 'D', L: 'R', R: 'L' };

  function parseLevel(level) {
    var rows = level.grid;
    var h = rows.length, w = rows[0].length;
    var walls = new Array(h * w).fill(false);
    var posA = null, posB = null, goalA = null, goalB = null;
    for (var r = 0; r < h; r++) {
      if (rows[r].length !== w) throw new Error('grille non rectangulaire niveau ' + level.name);
      for (var c = 0; c < w; c++) {
        var ch = rows[r][c];
        if (ch === '#') walls[r * w + c] = true;
        else if (ch === 'A') posA = r * w + c;
        else if (ch === 'B') posB = r * w + c;
        else if (ch === 'a') goalA = r * w + c;
        else if (ch === 'b') goalB = r * w + c;
        else if (ch !== '.') throw new Error('caractère inconnu « ' + ch + ' » niveau ' + level.name);
      }
    }
    if (posA === null || posB === null || goalA === null || goalB === null)
      throw new Error('niveau ' + level.name + ' : il faut A, B, a et b');
    if (posA === posB) throw new Error('niveau ' + level.name + ' : A et B superposés');
    return { w: w, h: h, walls: walls, posA: posA, posB: posB, goalA: goalA, goalB: goalB,
             name: level.name, par: level.par || null, theme: level.theme || null };
  }

  function createState(level) {
    var g = parseLevel(level);
    return { w: g.w, h: g.h, walls: g.walls,
             posA: g.posA, posB: g.posB, goalA: g.goalA, goalB: g.goalB,
             name: g.name, par: g.par, theme: g.theme,
             moves: 0, won: false, history: [] };
  }

  // Case cible d'un pas depuis idx dans dir, ou null si mur / hors grille.
  function step(state, idx, dir) {
    var r = Math.floor(idx / state.w), c = idx % state.w;
    var d = DIRS[dir];
    var nr = r + d[0], nc = c + d[1];
    if (nr < 0 || nr >= state.h || nc < 0 || nc >= state.w) return null;
    var ni = nr * state.w + nc;
    return state.walls[ni] ? null : ni;
  }

  /*
   * Applique un ordre aux deux lucioles simultanément.
   * Renvoie { moved: bool, aMoved: bool, bMoved: bool, blocked: string|null, won: bool }.
   * Règles de résolution simultanée :
   *  - une luciole face à un mur reste sur place ;
   *  - l'autre ne peut pas entrer sur la case d'une luciole immobile ;
   *  - deux lucioles qui visent la même case vide restent toutes deux sur place ;
   *  - deux lucioles qui se croisent (échange de cases) restent sur place.
   */
  function attemptMove(state, dir) {
    if (state.won) return { moved: false, aMoved: false, bMoved: false, blocked: 'won', won: true };
    if (!DIRS[dir]) throw new Error('direction inconnue ' + dir);
    var ta = step(state, state.posA, dir);
    var tb = step(state, state.posB, MIRROR[dir]);
    var na = ta === null ? state.posA : ta;
    var nb = tb === null ? state.posB : tb;

    var blocked = null;
    if (ta !== null && ta === state.posB && tb === null) { na = state.posA; blocked = 'A'; }
    else if (tb !== null && tb === state.posA && ta === null) { nb = state.posB; blocked = 'B'; }
    else if (ta !== null && tb !== null && ta === tb) { na = state.posA; nb = state.posB; blocked = 'both'; }
    else if (ta === state.posB && tb === state.posA && ta !== null && tb !== null) { na = state.posA; nb = state.posB; blocked = 'swap'; }

    if (na === state.posA && nb === state.posB)
      return { moved: false, aMoved: false, bMoved: false, blocked: blocked || 'walls', won: false };

    state.history.push({ posA: state.posA, posB: state.posB, moves: state.moves });
    state.posA = na; state.posB = nb; state.moves++;
    state.won = state.posA === state.goalA && state.posB === state.goalB;
    return { moved: true, aMoved: na !== state.history[state.history.length - 1].posA,
             bMoved: nb !== state.history[state.history.length - 1].posB,
             blocked: null, won: state.won };
  }

  function undo(state) {
    if (!state.history.length || state.won) return false;
    var prev = state.history.pop();
    state.posA = prev.posA; state.posB = prev.posB; state.moves = prev.moves;
    return true;
  }

  // Solveur BFS (tests) : distance minimale en coups, ou -1 si insoluble.
  function solve(state) {
    var start = state.posA * state.w * state.h + state.posB;
    var target = state.goalA * state.w * state.h + state.goalB;
    if (start === target) return 0;
    var dist = {}; dist[start] = 0;
    var queue = [start];
    var head = 0;
    while (head < queue.length) {
      var cur = queue[head++];
      var posA = Math.floor(cur / (state.w * state.h)), posB = cur % (state.w * state.h);
      for (var dir in DIRS) {
        var probe = { w: state.w, h: state.h, walls: state.walls,
                      posA: posA, posB: posB, goalA: state.goalA, goalB: state.goalB,
                      moves: 0, won: false, history: [] };
        var r = attemptMove(probe, dir);
        if (!r.moved) continue;
        var key = probe.posA * state.w * state.h + probe.posB;
        if (dist[key] === undefined) {
          dist[key] = dist[cur] + 1;
          if (key === target) return dist[key];
          queue.push(key);
        }
      }
    }
    return -1;
  }

  return { DIRS: DIRS, MIRROR: MIRROR, parseLevel: parseLevel, createState: createState,
           attemptMove: attemptMove, undo: undo, solve: solve, step: step };
});

</script>

/*
 * Reflet — mini-synthé WebAudio (aucun asset externe).
 */
(function (root, factory) {
  if (typeof module === 'object' && module.exports) module.exports = factory(root);
  else root.RefletAudio = factory(root);
})(typeof self !== 'undefined' ? self : this, function (root) {
  'use strict';
  var ctx = null, enabled = true;

  function ensure() {
    if (!ctx) {
      var AC = root.AudioContext || root.webkitAudioContext;
      if (!AC) return null;
      ctx = new AC();
    }
    if (ctx.state === 'suspended') ctx.resume();
    return ctx;
  }

  function tone(freq, dur, type, gain, when, slideTo) {
    if (!enabled) return;
    try {
      var c = ensure();
      if (!c) return;
      var t = c.currentTime + (when || 0);
      var o = c.createOscillator(), g = c.createGain();
      o.type = type || 'sine';
      o.frequency.setValueAtTime(freq, t);
      if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t + dur);
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(gain || 0.12, t + 0.012);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      o.connect(g); g.connect(c.destination);
      o.start(t); o.stop(t + dur + 0.05);
    } catch (e) { /* audio indisponible : le jeu reste jouable en silence */ }
  }

  return {
    setEnabled: function (v) { enabled = !!v; },
    isEnabled: function () { return enabled; },
    unlock: function () { ensure(); },
    move: function () { tone(430, 0.09, 'sine', 0.08, 0, 620); },
    blocked: function () { tone(120, 0.12, 'square', 0.05, 0, 80); },
    ui: function () { tone(700, 0.05, 'sine', 0.05); },
    star: function (i) { tone(660 + i * 220, 0.12, 'sine', 0.09); },
    win: function () {
      [523, 659, 784, 1047].forEach(function (f, i) { tone(f, 0.16, 'sine', 0.09, i * 0.09); });
      tone(1568, 0.3, 'sine', 0.05, 0.4);
    }
  };
});

  <script>
/*
 * Reflet — contrôleur d'interface (écrans, plateau, entrées clavier/tactile).
 */
(function () {
  'use strict';
  var E = window.RefletEngine, LV = window.RefletLevels.levels, I18N = window.RefletI18n, AU = window.RefletAudio;

  var SAVE_KEY = 'reflet.save.v1';
  var save = { unlocked: 1, stars: {}, best: {}, lang: 'en', sound: true };
  try {
    var raw = localStorage.getItem(SAVE_KEY);
    if (raw) {
      var parsed = JSON.parse(raw);
      save = { unlocked: parsed.unlocked || 1, stars: parsed.stars || {},
               best: parsed.best || {}, lang: parsed.lang || 'en', sound: parsed.sound !== false };
    }
  } catch (e) { /* stockage indisponible : partie sans sauvegarde */ }

  function persist() { try { localStorage.setItem(SAVE_KEY, JSON.stringify(save)); } catch (e) {} }
  function t(key) { return I18N.get(save.lang, key); }

  var state = null;        // état moteur du niveau courant
  var levelIndex = 0;
  var busy = false;        // évite les entrées pendant l'animation de victoire

  // ---------------------------------------------------------------- utilitaires
  function $(id) { return document.getElementById(id); }
  function el(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text !== undefined) n.textContent = text;
    return n;
  }
  function show(node, on) { node.classList.toggle('hidden', !on); }

  function starsFor(moves, par) {
    if (moves <= par) return 3;
    if (moves <= par + 3) return 2;
    return 1;
  }

  // ---------------------------------------------------------------- i18n rendu
  function renderTexts() {
    document.documentElement.lang = save.lang;
    var nodes = document.querySelectorAll('[data-i18n]');
    for (var i = 0; i < nodes.length; i++) nodes[i].textContent = t(nodes[i].getAttribute('data-i18n'));
    $('tagline').textContent = t('tagline');
    $('btn-play').textContent = save.unlocked > 1 && LV.length ? t('continueGame') : t('play');
    $('btn-howto').textContent = t('howTo');
    $('btn-sound').textContent = save.sound ? '♪ ' + t('soundOn') : '✕ ' + t('soundOff');
    $('btn-sound').setAttribute('aria-label', t('soundOn'));
    $('btn-menu').textContent = t('menu');
    $('btn-undo').textContent = '⟲ ' + t('undo');
    $('btn-restart').textContent = t('restart');
    $('btn-rules-game').textContent = '?';
    $('btn-rules-game').setAttribute('aria-label', t('howTo'));
    $('goal-hint').textContent = t('goalHint');
    renderLangPills();
    renderLevelGrid();
    if (state) renderHud();
  }

  function renderLangPills() {
    var box = $('langs');
    box.textContent = '';
    I18N.langs.forEach(function (code) {
      var b = el('button', 'pill' + (save.lang === code ? ' active' : ''), code.toUpperCase());
      b.addEventListener('click', function () {
        save.lang = code; persist(); AU.ui(); renderTexts();
      });
      box.appendChild(b);
    });
  }

  // ---------------------------------------------------------------- écran niveaux
  function renderLevelGrid() {
    var grid = $('levelgrid');
    grid.textContent = '';
    LV.forEach(function (lvl, i) {
      var locked = i + 1 > save.unlocked;
      var chip = el('button', 'chip' + (locked ? ' locked' : ''));
      chip.textContent = locked ? '🔒' : String(i + 1);
      if (!locked) {
        var stars = save.stars[i] || 0;
        var row = el('span', 'chip-stars', '★'.repeat(stars) || '');
        chip.appendChild(row);
        chip.addEventListener('click', function () { AU.ui(); openLevel(i); });
      }
      grid.appendChild(chip);
    });
  }

  // ---------------------------------------------------------------- plateau
  function cellSize() {
    var w = state.w, h = state.h;
    var availW = Math.min(window.innerWidth - 28, 560);
    var availH = window.innerHeight - 340;
    var s = Math.floor(Math.min(availW / w, availH / h, 64));
    return Math.max(30, s);
  }

  function buildBoard() {
    var board = $('board');
    board.textContent = '';
    var s = cellSize(), w = state.w, h = state.h;
    board.style.width = w * s + 'px';
    board.style.height = h * s + 'px';

    for (var r = 0; r < h; r++) {
      for (var c = 0; c < w; c++) {
        var cell = el('div', 'cell');
        cell.style.left = c * s + 'px';
        cell.style.top = r * s + 'px';
        cell.style.width = s + 'px';
        cell.style.height = s + 'px';
        if ((r + c) % 2 === 0) cell.classList.add('alt');
        var idx = r * w + c;
        if (state.walls[idx]) cell.classList.add('wall');
        else if (idx === state.goalA) cell.classList.add('goal-a');
        else if (idx === state.goalB) cell.classList.add('goal-b');
        board.appendChild(cell);
      }
    }
    ['a', 'b'].forEach(function (which) {
      var fly = el('div', 'fly ' + which);
      fly.style.width = s + 'px';
      fly.style.height = s + 'px';
      board.appendChild(fly);
    });
    placeFlies(true);
  }

  window.addEventListener('resize', function () {
    if (state && !busy) buildBoard();
  });

  function placeFlies(instant) {
    var s = cellSize();
    var board = $('board');
    var flies = board.querySelectorAll('.fly');
    if (flies.length < 2) return;
    if (instant) {
      flies[0].style.transition = 'none';
      flies[1].style.transition = 'none';
    }
    flies[0].style.transform = 'translate(' + (state.posA % state.w) * s + 'px,' + Math.floor(state.posA / state.w) * s + 'px)';
    flies[1].style.transform = 'translate(' + (state.posB % state.w) * s + 'px,' + Math.floor(state.posB / state.w) * s + 'px)';
    if (instant) {
      void board.offsetWidth; // reflow avant de réactiver les transitions
      flies[0].style.transition = '';
      flies[1].style.transition = '';
    }
  }

  // ---------------------------------------------------------------- HUD
  function renderHud() {
    var lvl = LV[levelIndex];
    $('hud-level').textContent = t('level') + ' ' + (levelIndex + 1) + ' — ' + lvl.name;
    $('hud-moves').textContent = state.moves + ' ' + t(state.moves === 1 ? 'movesOne' : 'moves') + ' · ' + t('par') + ' ' + lvl.par;
  }

  function openLevel(i) {
    levelIndex = i;
    state = E.createState(LV[i]);
    busy = false;
    show($('home'), false);
    show($('game'), true);
    renderHud();
    buildBoard();
  }

  function goMenu() {
    state = null; busy = false;
    show($('game'), false);
    show($('home'), true);
    renderTexts();
  }

  // ---------------------------------------------------------------- interactions
  function doMove(dir) {
    if (!state || busy) return;
    var r = E.attemptMove(state, dir);
    if (!r.moved) {
      AU.blocked();
      var board = $('board');
      board.classList.remove('shake');
      void board.offsetWidth;
      board.classList.add('shake');
      return;
    }
    AU.move();
    placeFlies(false);
    renderHud();
    if (r.won) {
      busy = true;
      var stars = starsFor(state.moves, LV[levelIndex].par);
      save.stars[levelIndex] = Math.max(save.stars[levelIndex] || 0, stars);
      save.best[levelIndex] = Math.min(save.best[levelIndex] || Infinity, state.moves);
      if (levelIndex + 2 > save.unlocked) save.unlocked = Math.min(LV.length, levelIndex + 2);
      persist();
      $('board').querySelectorAll('.fly').forEach(function (f) { f.classList.add('home'); });
      setTimeout(function () { AU.win(); showWin(stars); }, 480);
    }
  }

  function doUndo() {
    if (!state || busy) return;
    if (E.undo(state)) { AU.ui(); placeFlies(false); renderHud(); }
  }

  function doRestart() {
    if (!state || busy) return;
    AU.ui();
    openLevel(levelIndex);
  }

  // ---------------------------------------------------------------- superpositions
  function overlay(content) {
    var card = $('overlay-card');
    card.textContent = '';
    card.appendChild(content);
    show($('overlay'), true);
  }
  function closeOverlay() { show($('overlay'), false); }

  function showRules() {
    var box = el('div', 'rules');
    box.appendChild(el('h2', null, t('rulesTitle')));
    [1, 2, 3, 4].forEach(function (n) {
      box.appendChild(el('p', null, t('rule' + n)));
    });
    var demo = el('div', 'rules-demo');
    demo.appendChild(el('span', 'demo-note', 'you →'));
    demo.appendChild(el('span', 'demo-fly a', '●'));
    demo.appendChild(el('span', 'demo-note', '·'));
    demo.appendChild(el('span', 'demo-fly b', '●'));
    demo.appendChild(el('span', 'demo-note', '← twin'));
    box.appendChild(demo);
    var btn = el('button', 'primary', t('gotIt'));
    btn.addEventListener('click', function () { AU.ui(); closeOverlay(); });
    box.appendChild(btn);
    overlay(box);
  }

  function showWin(stars) {
    for (var i = 0; i < stars; i++) setTimeout(AU.star.bind(null, i), 250 + i * 180);
    var box = el('div', 'modal');
    var isLast = levelIndex === LV.length - 1;
    if (isLast) {
      var total = 0;
      LV.forEach(function (_, i) { total += save.best[i] || 0; });
      box.appendChild(el('h2', null, t('finalTitle')));
      box.appendChild(el('p', null, t('finalBody')));
      box.appendChild(el('p', 'big', t('total') + ' : ' + total));
      var again = el('button', 'primary', t('replayAll'));
      again.addEventListener('click', function () {
        AU.ui(); closeOverlay();
        save.unlocked = 1; save.stars = {}; save.best = {}; persist();
        openLevel(0);
      });
      box.appendChild(again);
    } else {
      box.appendChild(el('h2', null, t('wonTitle')));
      var row = el('div', 'star-row');
      for (var s = 0; s < 3; s++) row.appendChild(el('span', 'star' + (s < stars ? ' on' : ''), '★'));
      box.appendChild(row);
      box.appendChild(el('p', null, state.moves + ' ' + t(state.moves === 1 ? 'movesOne' : 'moves') + ' · ' + t('par') + ' ' + LV[levelIndex].par));
      var next = el('button', 'primary', t('next'));
      next.addEventListener('click', function () { AU.ui(); closeOverlay(); openLevel(levelIndex + 1); });
      box.appendChild(next);
    }
    var replay = el('button', null, t('replay'));
    replay.addEventListener('click', function () { AU.ui(); closeOverlay(); openLevel(levelIndex); });
    var menu = el('button', null, t('menu'));
    menu.addEventListener('click', function () { AU.ui(); closeOverlay(); goMenu(); });
    var row2 = el('div', 'btn-row');
    row2.appendChild(replay); row2.appendChild(menu);
    box.appendChild(row2);
    overlay(box);
  }

  // ---------------------------------------------------------------- entrées
  var KEYMAP = {
    ArrowUp: 'U', ArrowDown: 'D', ArrowLeft: 'L', ArrowRight: 'R',
    w: 'U', s: 'D', a: 'L', d: 'R',          // WASD
    z: 'U', q: 'L'                            // ZQSD (clavier FR)
  };
  document.addEventListener('keydown', function (ev) {
    if (!state) return;
    var k = ev.key.length === 1 ? ev.key.toLowerCase() : ev.key;
    if (KEYMAP[k]) { ev.preventDefault(); doMove(KEYMAP[k]); AU.unlock(); return; }
    if (k === 'u') { ev.preventDefault(); doUndo(); }
    if (k === 'r') { ev.preventDefault(); doRestart(); }
    if (k === 'Escape') { closeOverlay(); }
  });

  // glisser tactile sur le plateau
  var touchStart = null;
  $('board').addEventListener('touchstart', function (ev) {
    if (ev.touches.length === 1) {
      touchStart = { x: ev.touches[0].clientX, y: ev.touches[0].clientY };
      AU.unlock();
    }
  }, { passive: true });
  $('board').addEventListener('touchend', function (ev) {
    if (!touchStart) return;
    var dx = ev.changedTouches[0].clientX - touchStart.x;
    var dy = ev.changedTouches[0].clientY - touchStart.y;
    touchStart = null;
    if (Math.abs(dx) < 18 && Math.abs(dy) < 18) return;
    if (Math.abs(dx) > Math.abs(dy)) doMove(dx > 0 ? 'R' : 'L');
    else doMove(dy > 0 ? 'D' : 'U');
  }, { passive: true });

  $('board').addEventListener('pointerdown', function () { AU.unlock(); });

  // croix directionnelle
  [['dpad-u', 'U'], ['dpad-d', 'D'], ['dpad-l', 'L'], ['dpad-r', 'R']].forEach(function (pair) {
    $(pair[0]).addEventListener('click', function () { AU.unlock(); doMove(pair[1]); });
  });

  // afficher la croix sur écran tactile
  window.addEventListener('touchstart', function () {
    document.body.classList.add('touch');
  }, { once: true, passive: true });
  if (window.matchMedia && window.matchMedia('(pointer: coarse)').matches) {
    document.body.classList.add('touch');
  }

  // ---------------------------------------------------------------- boutons
  $('btn-play').addEventListener('click', function () {
    AU.ui(); AU.unlock();
    var next = Math.min(save.unlocked, LV.length) - 1;
    openLevel(next);
  });
  $('btn-howto').addEventListener('click', function () { AU.ui(); showRules(); });
  $('btn-rules-game').addEventListener('click', function () { AU.ui(); showRules(); });
  $('btn-sound').addEventListener('click', function () {
    save.sound = !save.sound; persist();
    AU.setEnabled(save.sound);
    renderTexts();
    if (save.sound) AU.ui();
  });
  $('btn-menu').addEventListener('click', function () { AU.ui(); goMenu(); });
  $('btn-undo').addEventListener('click', function () { AU.unlock(); doUndo(); });
  $('btn-restart').addEventListener('click', function () { AU.unlock(); doRestart(); });
  $('overlay').addEventListener('click', function (ev) {
    if (ev.target === $('overlay')) closeOverlay();
  });

  // ---------------------------------------------------------------- démarrage
  AU.setEnabled(save.sound);
  renderTexts();
  show($('home'), true);
})();
