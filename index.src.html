<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Reflet</title>
  <meta name="description" content="Reflet — a puzzle of twin lights. One command drives two fireflies; her left is your right.">
  <link rel="stylesheet" href="assets/style.css">
</head>
<body>
  <div id="app">
    <header id="top">
      <div class="brand">
        <h1>Reflet</h1>
        <p id="tagline"></p>
      </div>
      <div class="topctl">
        <div id="langs" class="langs" role="group" aria-label="Language"></div>
        <button id="btn-sound" class="ghost"></button>
      </div>
    </header>

    <main>
      <section id="home" class="screen">
        <p class="subtitle" data-i18n="subtitle"></p>
        <div class="homebtns">
          <button id="btn-play" class="primary big"></button>
          <button id="btn-howto" class="ghost big"></button>
        </div>
        <div id="levelgrid" class="levelgrid"></div>
        <p class="keys" data-i18n="keysHint"></p>
      </section>

      <section id="game" class="screen hidden">
        <div class="hud">
          <button id="btn-menu" class="ghost"></button>
          <div class="hud-mid">
            <span id="hud-level"></span>
            <span id="hud-moves" class="muted"></span>
          </div>
          <div class="hud-right">
            <button id="btn-undo" class="ghost"></button>
            <button id="btn-restart" class="ghost"></button>
            <button id="btn-rules-game" class="ghost round"></button>
          </div>
        </div>
        <p id="goal-hint" class="goalhint"></p>
        <div id="board-wrap"><div id="board" tabindex="0" aria-label="Reflet board"></div></div>
        <div id="dpad" class="dpad">
          <span></span><button id="dpad-u" class="ghost" aria-label="Up">▲</button><span></span>
          <button id="dpad-l" class="ghost" aria-label="Left">◀</button>
          <button id="dpad-d" class="ghost" aria-label="Down">▼</button>
          <button id="dpad-r" class="ghost" aria-label="Right">▶</button>
        </div>
        <p class="keys touch-only" data-i18n="touchHint"></p>
      </section>
    </main>

    <footer>
      <span data-i18n="credit"></span> · <span class="series">Jeux impossibles</span>
    </footer>
  </div>

  <div id="overlay" class="hidden" role="dialog" aria-modal="true">
    <div id="overlay-card"></div>
  </div>

  <script src="assets/engine.js"></script>
  <script src="assets/levels.js"></script>
  <script src="assets/i18n.js"></script>
  <script src="assets/audio.js"></script>
  <script src="assets/ui.js"></script>
</body>
</html>
